name: Build NetInstall Bootstrap

on:
  push:
    paths:
      - 'boot/ipxe/**'
      - 'scripts/build-ipxe.sh'
      - 'scripts/make-usb-tree.sh'
      - '.github/workflows/build-bootstrap.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NetInstall
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc make git binutils perl xz-utils liblzma-dev

      - name: Build embedded iPXE EFI
        env:
          IPXE_REF: master
        run: |
          chmod +x scripts/build-ipxe.sh scripts/make-usb-tree.sh
          bash scripts/build-ipxe.sh

      - name: Prepare USB tree
        run: bash scripts/make-usb-tree.sh

      - name: Validate EFI artifact
        run: |
          file dist/BOOTX64.EFI
          test -s dist/BOOTX64.EFI
          sha256sum -c dist/BOOTX64.EFI.sha256

      - name: Package USB tree
        run: tar -C dist -czf netinstall-usb-tree.tar.gz usb-tree

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netinstall-bootstrap
          path: |
            dist/BOOTX64.EFI
            dist/BOOTX64.EFI.sha256
            netinstall-usb-tree.tar.gz
