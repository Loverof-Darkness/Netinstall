# NetInstall Debian example preseed.
# Deliberately omits automatic destructive partitioning; provide a reviewed
# storage policy before enabling unattended disk changes.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i passwd/username string installer
d-i passwd/user-fullname string NetInstall User
# Set a password hash only in a private deployment configuration.
d-i passwd/user-password-crypted password REPLACE_WITH_A_REAL_HASH
d-i finish-install/reboot_in_progress note
