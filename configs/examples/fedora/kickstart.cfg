# NetInstall Fedora Anaconda/Kickstart example.
# Storage directives are intentionally absent until a reviewed disk policy exists.
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --activate
rootpw --lock
user --name=installer --groups=wheel --password=REPLACE_WITH_A_HASH --iscrypted
firewall --enabled
selinux --enforcing
reboot
